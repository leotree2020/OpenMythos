# C: negative control using UNPATCHED train.py. DESIGN ONLY. NOT EXECUTED.
# Gate 2 Stage B — RESUME TEMPLATE / NOT EXECUTED
# Fill resume_checkpoint_path with the absolute path of the Stage A intermediate checkpoint.
# Verification must check model weights, optimizer state, scheduler, RNG, and data iterator position.
# Load-without-error is not success. Must confirm at least one real parameter update after resume.
# Must record whether a batch is skipped or repeated.

run_name: p1c-gate2-stage-b
resume: true
resume_checkpoint_path: ""   # REQUIRED before launch
seed: 42
out_dir: outputs/p1c-gate2-stage-b

model_name: parcae-small-140m
model_impl: dynamic

block_size: 128
model_overwrite:
  vocab_size: 32768
  prelude_norm: true
  block_size: 128

world_batch_size: 8
micro_batch_size: 2

optimizer: MuonAdamW
optim_config:
  lr: 8e-3
  weight_decay: 0.0
  betas: [0.8, 0.95]
  eps: 1e-10
  muon_lr: 8e-3
  muon_momentum: 0.95
  muon_wd: 0.2
  muon_ns_steps: 5

warmup_steps: 0
cooldown_steps: 0
lr_schedule: trapezoid
min_lr: 0
grad_clip: 1.0

fabric_strategy: ddp
fabric_precision: bf16-mixed

compile_model: false
gradient_checkpointing: false

max_steps: 6
save_step_interval: 2
save_last_step: true
eval_step_interval: 1000
eval_iters: 1

data_config:
  train_data:
    - type: rngds
      prefix: ""
      weight: 1
  val_data:
    - type: rngds
      prefix: ""
      weight: 1

# tokenizer_path: /absolute/path/to/alt_tokenizer

logger_name: wandb
logger_project: parcae
log_step_interval: 1
