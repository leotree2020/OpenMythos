# CONFIG (CLI-parsed on CPU) / GPU EXECUTION NOT TESTED
# Pinned Parcae: 69284c13746e849104f738d6d1a347b1f457df76
# Requires LOCAL_WORLD_SIZE=1 before CLISettings init on CPU.
# tokenizer_path must point to an ALTERNATIVE TEST TOKENIZER directory.

run_name: p1c-min-train-alt-tok
resume: false
seed: 42
out_dir: outputs/p1c-min-train

model_name: parcae-small-140m
model_impl: dynamic

block_size: 128
model_overwrite:
  vocab_size: 32768
  prelude_norm: true
  block_size: 128

world_batch_size: 8
micro_batch_size: 2
# gradient_accumulation_steps = 4 when devices=1, num_nodes=1

optimizer: MuonAdamW
optim_config:
  lr: 8e-3
  weight_decay: 0.0
  betas: [0.8, 0.95]
  eps: 1e-10
  muon_lr: 8e-3
  muon_momentum: 0.95
  muon_wd: 0.2
  muon_ns_steps: 5

warmup_steps: 0
cooldown_steps: 0
lr_schedule: trapezoid
min_lr: 0
grad_clip: 1.0

fabric_strategy: ddp
fabric_precision: bf16-mixed

compile_model: false
gradient_checkpointing: false

max_steps: 6
save_step_interval: 2
save_last_step: true
eval_step_interval: 1000
eval_iters: 1

data_config:
  train_data:
    - type: rngds
      prefix: ""
      weight: 1
  val_data:
    - type: rngds
      prefix: ""
      weight: 1

# ALTERNATIVE TEST TOKENIZER (fill after generation)
# tokenizer_path: /path/to/alt_tok/tokenizer

logger_name: wandb
logger_project: parcae
log_step_interval: 1

# PREDICTED / NOT RUNTIME VERIFIED (source derivation):
# max_steps=6, gradient_accumulation_steps=4
# predicted microbatch_step = 20
# predicted optimizer_step = 5
# predicted actual optimizer.step() = 4  (first optimizer_step skips)
# predicted regular save boundaries: microbatch 4, 8, 12, 16, 20
#
# rngds uses tokenizer vocab_size (actual 489 for the alt tokenizer).
# model_overwrite vocab_size remains 32768. Not full-vocab training.
# Not language learning.
#
# Launch (NOT EXECUTED):
#   export LOCAL_WORLD_SIZE=1
#   export WANDB_MODE=offline
#   bash runs/run_training.sh <this-file> p1c-min-train group 1
