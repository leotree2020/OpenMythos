name: Mini-Mythos upstream validation
on:
  workflow_dispatch:
  push:
    branches: [mini-mythos-research]
    paths:
      - 'research/mini_mythos/**'
      - '.github/workflows/mini-mythos-smoke.yml'
  pull_request:
    paths:
      - 'research/mini_mythos/**'
      - '.github/workflows/mini-mythos-smoke.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install helpers requirements
        # datasets: the R2 shard/replay tests build local HF Dataset fixtures (repo pins datasets>=2.18.0).
        run: python -m pip install 'torch>=2.1,<3' 'transformers>=4.40,<6' 'datasets>=2.18.0,<6'
      - name: Verify independent helper tests
        run: python -m unittest discover -s research/mini_mythos/tests -v

  upstream-smoke:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attention: [gqa, mla]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream import and CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.1,<3' 'transformers>=4.40,<6'
      - name: Capture provenance
        run: |
          git rev-parse HEAD
          python -c 'import torch, transformers; print("torch",torch.__version__,"transformers",transformers.__version__)'
      - name: Capture verified local source provenance
        run: python research/mini_mythos/scripts/provenance.py --repo . --out research/mini_mythos/results/provenance.json --strict
      - name: Static audit (findings, not proof)
        run: python research/mini_mythos/scripts/static_audit.py --repo . --out research/mini_mythos/results/static_audit.json
      - name: Test upstream forward, backward, causal mask, cache
        run: python research/mini_mythos/scripts/smoke.py --repo . --attention ${{ matrix.attention }} --out research/mini_mythos/results/smoke_${{ matrix.attention }}.json
      - name: Examine ACT weight mass on actual upstream model
        if: always()
        run: python research/mini_mythos/scripts/act_diagnostics.py --repo . --attention ${{ matrix.attention }} --out research/mini_mythos/results/act_${{ matrix.attention }}.json
      - name: ACT final remainder A/B experiment (toy CPU)
        run: python research/mini_mythos/scripts/act_ab.py --repo . --device cpu --attentions ${{ matrix.attention }} --depths 1 2 4 8 --steps 3 --out research/mini_mythos/results/act_ab_${{ matrix.attention }}.json
      - name: ACT-002 same-weight counterfactual (toy CPU)
        run: python research/mini_mythos/scripts/act_counterfactual.py --repo . --device cpu --attentions ${{ matrix.attention }} --depths 2 --seed 22 --steps 4 --out research/mini_mythos/results/act_counterfactual_${{ matrix.attention }}.json
      - name: Tiny upstream training pipeline check (GQA only)
        if: matrix.attention == 'gqa'
        run: python research/mini_mythos/scripts/pilot_train.py --repo . --steps 2 --train-depths 1 4 --out research/mini_mythos/results/pilot.json
      - name: R0 cached-chunk differential regression
        run: python research/mini_mythos/scripts/r0_cache_compare.py --repo . --attentions ${{ matrix.attention }} --strict
      - name: R1 tiny text-pilot plumbing smoke (fixture, not real benchmark)
        if: matrix.attention == 'gqa'
        run: |
          mkdir -p research/mini_mythos/results/r1/ci_fixture
          printf 'The model trains on a few words for a pipeline check. This prose is a CI fixture.\n\nRepeating familiar English text tests only the software path.\n' > research/mini_mythos/results/r1/ci_fixture/train.txt
          printf 'The validation fixture contains different English sentences. This is heldout from the tiny CI train fixture.\n\nNo claim of learned language ability is made here.\n' > research/mini_mythos/results/r1/ci_fixture/validation.txt
          python research/mini_mythos/scripts/r1_text_pilot.py --repo . \
            --train-text research/mini_mythos/results/r1/ci_fixture/train.txt \
            --validation-text research/mini_mythos/results/r1/ci_fixture/validation.txt \
            --attention gqa --seq-len 16 --batch-size 1 --steps 2 \
            --eval-windows 2 --generate-tokens 2 \
            --out-dir research/mini_mythos/results/r1/ci_smoke
      - name: Archive and verify partial CI evidence (synthetic outputs)
        run: |
          python research/mini_mythos/scripts/evidence_archive.py pack --repo . --allow-partial --out research/mini_mythos/archives/ci_${{ matrix.attention }}.zip
          python research/mini_mythos/scripts/evidence_archive.py verify research/mini_mythos/archives/ci_${{ matrix.attention }}.zip
      - name: Upload reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-mythos-${{ matrix.attention }}-report
          path: |
            research/mini_mythos/results/
            research/mini_mythos/archives/
          if-no-files-found: ignore
